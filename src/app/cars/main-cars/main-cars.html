<section>
  <h1>Panel sterowania</h1>
  
  <p class="tittle">Wszystkie modele:</p>

  <div class="container">
    <div class="grid">
      <div [routerLink]="['/view-car', car.id]" *ngFor="let car of pagedCars;" class="carCard">
        <div class="carRow">
          <p>marka:</p>

          <p class="bold">{{car.brand}}</p>
        </div>

        <div class="carRow">
          <p>model:</p>
          <p class="bold">{{car.model}}</p>
        </div>

        <div class="carRow">
          <p>cena:</p>
          <p class="bold">{{car.price + 'zł/h'}}</p>
        </div>

        <div class="d-grid gap-2">
          <button class="btn btn-outline-warning" type="button">Modyfikuj</button>
          <button (click)="delCar(car.id, $event)" class="btn btn-outline-danger" type="button">Usuń</button>
        </div>
      </div>
    </div>
  </div>

<nav class="paginator" aria-label="Page navigation">
  <ul>
    <li (click)="prevPage()" [class.disabled]="page === 1">
      ‹
    </li>

    <li class="current">Strona {{page}}</li>

    <li (click)="nextPage()" 
        [class.disabled]="page * limit >= total">
      ›
    </li>
  </ul>
</nav>

</section>
