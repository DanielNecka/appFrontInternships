<section>
  <form class="searchForm">
    <input name="searchText" #searchText="ngModel" class="form-control" [(ngModel)]="searchForm.search" required
      pattern="^[A-ź\s0-9-]{2,20}$" autocomplete="off">

      <select class="form-select" name="column" #searchText="ngModel" [(ngModel)]="searchForm.column" required>
        <option value="brand">Marka</option>
        <option value="model">Model</option>
        <option value="maxPrice">Cena</option>
      </select>

      <button class="btn btn-outline-secondary" type="button" (click)="searchCars()">Szukaj</button>
  </form>

  <div class="grid searchCars">
    @for (car of searchCarsTable; track car) {
    <div [routerLink]="['/view-car', car.id]" class="carCard">
      <div class="carRow">
        <p class="gray">marka:</p>
        <p class="bold">{{car.brand}}</p>
      </div>
      <div class="carRow">
        <p class="gray">model:</p>
        <p class="bold">{{car.model}}</p>
      </div>
      <div class="carRow">
        <p class="gray">cena:</p>
        <p class="bold">{{car.price + ' zł/h'}}</p>
      </div>
      <div class="d-grid gap-2">
        <button class="btn btn-outline-secondary" type="button">Zobacz szczegóły</button>
      </div>
    </div>
    }
  </div>

  <h2>Wszystkie modele:</h2>

  <div class="grid">
    @for (car of pagedCars; track car) {
    <div [routerLink]="['/view-car', car.id]" class="carCard">
      <div class="carRow">
        <p class="gray">marka:</p>
        <p class="bold">{{car.brand}}</p>
      </div>
      <div class="carRow">
        <p class="gray">model:</p>
        <p class="bold">{{car.model}}</p>
      </div>
      <div class="carRow">
        <p class="gray">cena:</p>
        <p class="bold">{{car.price + ' zł/h'}}</p>
      </div>
      <div class="d-grid gap-2">
        <button class="btn btn-outline-secondary" type="button">Zobacz szczegóły</button>
      </div>
    </div>
    }
  </div>

  <nav class="paginator" aria-label="Page navigation">
    <button (click)="openModal('add', $event)" class="btn btn-outline-success" type="button" routerLink="/main-cars">
      Dodaj Samochód
    </button>
    <ul>
      <li (click)="prevPage()" [class.disabled]="page === 1">
        ‹
      </li>

      <li class="current">Strona {{page}}</li>

      <li (click)="nextPage()" [class.disabled]="page * limit >= total">
        ›
      </li>
    </ul>
  </nav>
</section>
