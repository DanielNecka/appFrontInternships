<form #carForm="ngForm" (ngSubmit)="onSave(carForm)">
    <div class="mb-3">
        <label
            for="brand"
            class="form-label"
            [class.text-danger]="brand.invalid && brand.touched"
        >Marka
        </label>

        <input
            id="brand"
            name="brand"
            [(ngModel)]="CarInputForm.brand"
            class="form-control"
            #brand = "ngModel"
            required
            pattern="^[A-ź\s]{3,20}$"
            autocomplete="off"
            [ngClass]="{'is-invalid': brand.invalid && brand.touched}"
        >
    </div>

    <div class="mb-3">
        <label
            for="model"
            class="form-label"
            [class.text-danger]="model.invalid && brand.touched"
        >Model
        </label>

        <input
            id="model"
            name="model"
            [(ngModel)]="CarInputForm.model"
            class="form-control"
            #model = "ngModel"
            required
            pattern="^[A-ź\s0-9\-_]{1,20}$"
            autocomplete="off"
            [ngClass]="{'is-invalid': model.invalid && brand.touched}"
        >
    </div>

    <div class="mb-3">
        <label 
            for="price" 
            class="form-label"
            [class.text-danger]="price.invalid && price.touched"
        >Cena (zł/h)
        </label>
        
        <input
            id="price"
            name="price"
            type="number"
            [(ngModel)]="CarInputForm.price"
            class="form-control"
            #price="ngModel"
            required
            min="0"
            max="9999"
            step="0.01"
            [ngClass]="{'is-invalid': price.invalid && price.touched}"
        >
    </div>

    @if (mode === 'mod') {
    <div class="form-check form-switch mb-3">
        <input
            id="isRented"
            name="isRented"
            type="checkbox"
            class="form-check-input"
            [(ngModel)]="CarInputForm.isRented"
        >
        <label class="form-check-label" for="isRented">Zaznacz, jeśli auto jest wynajęte</label>
    </div>
    }

    <div class="mb-3">
        <label
            for="fuelType"
            class="form-label"
        >Typ napędu</label>

        <select
            id="fuelType"
            name="fuelType"
            class="form-select"
            [(ngModel)]="CarInputForm.fuelType"
            #fuelType="ngModel"
            required
        >
            <option value="" disabled>Wybierz typ napędu</option>
            @for (type of fuelTypeOptions; track type) {
                <option [value]="type">{{ type }}</option>
            }
        </select>
        @if (fuelType.invalid && fuelType.touched) {
            <small class="text-danger">Wybierz typ napędu.</small>
        }
    </div>

    @if (mode === 'add') {
    <div class="mb-3">
        <label
            for="image"
            class="form-label"
        >Zdjęcie samochodu</label>

        <input
            id="image"
            type="file"
            class="form-control"
            accept="image/*"
            (change)="onFileSelected($event)"
        >
        @if (fileError) {
        <small class="text-danger">{{ fileError }}</small>
        }
        <small class="text-secondary d-block">Obsługiwane formaty: JPG, PNG, SVG. Maksymalnie 5 MB.</small>
    </div>
    }

    @if (mode === 'add' && imagePreviewUrl) {
    <div class="mb-3 text-center">
        <img [src]="imagePreviewUrl" alt="Podgląd zdjęcia" class="image-preview">
    </div>
    }

    <div class="d-flex justify-content-end gap-2 mt-3">
        <button class="btn btn-outline-secondary" type="button" (click)="close()">Wyjdź</button>
        <button class="btn btn-secondary" type="submit" [disabled]="carForm.invalid || (mode === 'add' && !selectedFile)">Zapisz</button>
    </div>
</form>
