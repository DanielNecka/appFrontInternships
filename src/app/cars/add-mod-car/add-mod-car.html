<form #carForm="ngForm" (ngSubmit)="onSave(carForm)">
    <div class="mb-3">
        <label for="brand" class="form-label">Marka</label>
        <input
            id="brand"
            name="brand"
            [(ngModel)]="formData.brand"
            class="form-control"
            required
            autocomplete="off"
        >
    </div>

    <div class="mb-3">
        <label for="model" class="form-label">Model</label>
        <input
            id="model"
            name="model"
            [(ngModel)]="formData.model"
            class="form-control"
            required
            autocomplete="off"
        >
    </div>

    <div class="mb-3">
        <label for="price" class="form-label">Cena (zł/h)</label>
        <input
            id="price"
            name="price"
            type="number"
            [(ngModel)]="formData.price"
            class="form-control"
            required
            min="0"
            step="0.01"
        >
    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
        <button class="btn btn-outline-secondary" type="button" (click)="close()">Wyjdź</button>
        <button class="btn btn-secondary" type="submit">Zapisz</button>
    </div>
</form>
